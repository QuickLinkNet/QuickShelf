<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />
    <title>QuickShelf</title>
    <meta name="description" content="QuickShelf – a fast, private cockpit for your NAS document and photo archive." />
    <script>
      // Theme vor dem ersten Paint setzen, damit nichts aufblitzt.
      try {
        var s = JSON.parse(localStorage.getItem('nas.settings') || '{}');
        var dark = s.theme === 'dunkel' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.accent = s.accent || 'violett';
        if (s.privacy) document.documentElement.classList.add('privacy');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
