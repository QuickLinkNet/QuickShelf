name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release
      - name: Zip
        run: cd release && zip -r "quickshelf-${GITHUB_REF_NAME}.zip" archiv
      - uses: softprops/action-gh-release@v3
        with:
          files: release/quickshelf-*.zip
          generate_release_notes: true
